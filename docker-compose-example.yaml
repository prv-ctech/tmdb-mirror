# Complete four-container Compose example.
# Copy .env.example to .env, edit .env, then run:
#   docker compose -f docker-compose-example.yaml up -d --build
# The application settings are loaded once through env_file. Only host-side
# mount paths and published ports belong in this file.

name: tmdb

services:
  postgres:
    image: postgres:18-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
    restart: unless-stopped
    env_file:
      - .env
    shm_size: 2gb
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
      - -c
      - timezone=UTC
      - -c
      - max_connections=200
      - -c
      - shared_buffers=32GB
      - -c
      - effective_cache_size=96GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - wal_compression=on
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=256
    volumes:
      - ./data/postgres18:/var/lib/postgresql
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD, pg_isready, -U, tmdb_owner, -d, tmdb, -h, 127.0.0.1]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [tmdb-private]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: tmdb-api:local
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    init: true
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, http://127.0.0.1:8080/health/live]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [tmdb-private]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: tmdb-worker:local
    restart: unless-stopped
    env_file:
      - .env
    entrypoint: [/usr/local/bin/tmdb-worker]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/config:/config
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    init: true
    networks: [tmdb-private]

  media:
    build:
      context: .
      dockerfile: Dockerfile
    image: tmdb-media:local
    restart: unless-stopped
    env_file:
      - .env
    entrypoint: [/usr/local/bin/tmdb-images]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/media:/media
      - ./data/config:/config
    ports:
      - "8090:8090"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    init: true
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8090/health/live]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [tmdb-private]

networks:
  tmdb-private:
    driver: bridge
