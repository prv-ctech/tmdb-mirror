name: tmdb-mirror

# Standalone Compose example. Keep .env beside this file.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-common: &app-common
  image: ghcr.io/prv-ctech/tmdb-mirror:main
  restart: unless-stopped
  env_file:
    - .env
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  init: true
  stop_grace_period: 45s
  logging: *default-logging

services:
  tmdb-mirror-postgres:
    image: ghcr.io/prv-ctech/tmdb-mirror-postgres:main
    user: "0:0"
    container_name: tmdb-mirror-postgres
    restart: unless-stopped
    env_file:
      - .env
    shm_size: 2gb
    stop_grace_period: 2m
    logging: *default-logging
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
      - -c
      - timezone=UTC
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=tmdb archive-push %p
      - -c
      - archive_timeout=300s
      - -c
      - max_connections=200
      - -c
      - shared_buffers=32GB
      - -c
      - effective_cache_size=96GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - wal_compression=on
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=256
    volumes:
      - type: bind
        source: ./data/postgres18
        target: /var/lib/postgresql
        bind:
          create_host_path: true
      - type: bind
        source: ./data/config
        target: /config
        bind:
          create_host_path: true
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -h 127.0.0.1 -t 1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - "your.network"

  api:
    <<: *app-common
    container_name: tmdb-mirror-api
    entrypoint: [/usr/local/bin/tmdb-runtime, api]
    depends_on:
      tmdb-mirror-postgres:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./data/config
        target: /config
        bind:
          create_host_path: true
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, http://127.0.0.1:9000/health/ready]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      "your.network":
        aliases:
          - tmdb-mirror-api

  worker:
    <<: *app-common
    container_name: tmdb-mirror-worker
    entrypoint: [/usr/local/bin/tmdb-runtime, worker]
    user: "0:0"
    init: false
    depends_on:
      tmdb-mirror-postgres:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./data/config
        target: /config
        bind:
          create_host_path: true
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, SETPCAP]
    networks:
      - "your.network"

  media:
    <<: *app-common
    container_name: tmdb-mirror-media
    entrypoint: [/usr/local/bin/tmdb-runtime, media]
    user: "0:0"
    init: false
    depends_on:
      tmdb-mirror-postgres:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./data/media
        target: /media
        bind:
          create_host_path: true
      - type: bind
        source: ./data/config
        target: /config
        bind:
          create_host_path: true
    ports:
      - "9002:9002"
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, SETPCAP]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:9002/health/live]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - "your.network"

networks:
  "your.network":
    external: true
