# PostgreSQL-only development fixture. The complete four-service stack is in
# compose.production.yaml; this file intentionally starts PostgreSQL only.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  tmdb-mirror-postgres:
    image: postgres:18-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
    env_file:
      - ./env.example
    logging: *default-logging
    stop_grace_period: 2m
    command: [postgres, -c, shared_preload_libraries=pg_stat_statements, -c, track_io_timing=on, -c, timezone=UTC, -c, max_connections=200]
    ports: ["127.0.0.1:${TMDB_DEV_PG_PORT:-55432}:5432"]
    volumes:
      - tmdb_pg18_data:/var/lib/postgresql
      - ../infra/postgres/initdb/10-bootstrap.sh:/docker-entrypoint-initdb.d/10-bootstrap.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -h 127.0.0.1 -t 1']
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [tmdb-internal, tmdb-loopback]

volumes:
  tmdb_pg18_data:

networks:
  tmdb-internal:
    driver: bridge
    internal: true
  tmdb-loopback:
    driver: bridge
