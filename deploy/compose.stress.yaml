# Disposable four-container stress environment.  It deliberately uses named
# volumes so it cannot touch production bind mounts.  The application still
# sees only /media and /config; the volume names are test deployment details.
services:
  postgres:
    image: postgres:18-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
    restart: unless-stopped
    # Exercise the same shared-memory contract as production. Without this,
    # PostgreSQL's parallel workers hit Docker's 64 MiB /dev/shm at 100 clients.
    shm_size: 1gb
    environment:
      POSTGRES_DB: tmdb
      POSTGRES_USER: tmdb_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_owner_password
      POSTGRES_INITDB_ARGS: --data-checksums --encoding=UTF8 --auth-host=scram-sha-256
      PGDATA: /var/lib/postgresql/18/docker
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
      - -c
      - timezone=UTC
      - -c
      - max_connections=${TMDB_STRESS_PG_MAX_CONNECTIONS:-120}
      - -c
      - shared_buffers=${TMDB_STRESS_PG_SHARED_BUFFERS:-2GB}
      - -c
      - effective_cache_size=${TMDB_STRESS_PG_EFFECTIVE_CACHE_SIZE:-8GB}
      - -c
      - work_mem=${TMDB_STRESS_PG_WORK_MEM:-32MB}
      - -c
      - maintenance_work_mem=${TMDB_STRESS_PG_MAINTENANCE_WORK_MEM:-512MB}
      - -c
      - wal_compression=on
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=64
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_completion_target=0.9
    ports:
      - 127.0.0.1:${TMDB_STRESS_PG_PORT:-55433}:5432
    volumes:
      - tmdb_stress_pg18_data:/var/lib/postgresql
      - ../infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    secrets:
      - postgres_owner_password
      - migrator_password
      - api_reader_password
      - api_job_submitter_password
      - ingest_writer_password
      - image_writer_password
      - monitor_password
    healthcheck:
      test: [CMD, pg_isready, -U, tmdb_owner, -d, tmdb, -h, 127.0.0.1]
      interval: 2s
      timeout: 3s
      retries: 45
      start_period: 10s
    networks: [tmdb-private]

  api:
    image: ${TMDB_STRESS_APP_IMAGE:-tmdb-stress-app:local}
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TMDB_ENVIRONMENT: test
      TMDB_API_BIND: 0.0.0.0:8080
      TMDB_ADMIN_BIND: 0.0.0.0:8081
      TMDB_API_KEY_FILE: /run/secrets/tmdb_api_key
      TMDB_DIRECT_DB_HOST: postgres
      TMDB_DIRECT_DB_PORT: 5432
      TMDB_DIRECT_DB_NAME: tmdb
      TMDB_DIRECT_DB_USER: api_reader
      TMDB_DIRECT_DB_PASSWORD_FILE: /run/secrets/api_reader_password
      TMDB_POOLED_DB_HOST: postgres
      TMDB_POOLED_DB_PORT: 5432
      TMDB_POOLED_DB_NAME: tmdb
      TMDB_POOLED_DB_USER: api_reader
      TMDB_POOLED_DB_PASSWORD_FILE: /run/secrets/api_reader_password
      ALLOW_LOCAL_MEDIA: ${ALLOW_LOCAL_MEDIA:-true}
      TMDB_MEDIA_BASE_URL: http://127.0.0.1:${TMDB_STRESS_IMAGE_PORT:-18090}/media
    secrets:
      - api_reader_password
      - tmdb_api_key
    ports:
      - 127.0.0.1:${TMDB_STRESS_API_PORT:-18080}:8080
      - 127.0.0.1:${TMDB_STRESS_ADMIN_PORT:-18081}:8081
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    init: true
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, http://127.0.0.1:8080/health/live]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks: [tmdb-private]

  worker:
    image: ${TMDB_STRESS_APP_IMAGE:-tmdb-stress-app:local}
    restart: on-failure
    entrypoint: [/usr/local/bin/tmdb-worker]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TMDB_ENVIRONMENT: test
      TMDB_MIGRATOR_DB_HOST: postgres
      TMDB_MIGRATOR_DB_PORT: 5432
      TMDB_MIGRATOR_DB_NAME: tmdb
      TMDB_MIGRATOR_DB_USER: migrator
      TMDB_MIGRATOR_DB_PASSWORD_FILE: /run/secrets/migrator_password
      TMDB_DIRECT_DB_HOST: postgres
      TMDB_DIRECT_DB_PORT: 5432
      TMDB_DIRECT_DB_NAME: tmdb
      TMDB_DIRECT_DB_USER: ingest_writer
      TMDB_DIRECT_DB_PASSWORD_FILE: /run/secrets/ingest_writer_password
      TMDB_API_BASE_URL: ${TMDB_API_BASE_URL:-https://api.themoviedb.org/3}
      TMDB_READ_ACCESS_TOKEN_FILE: /run/secrets/tmdb_read_access_token
      TMDB_RATE_LIMIT: ${TMDB_RATE_LIMIT:-40}
      TMDB_MAX_CONNECTIONS: ${TMDB_MAX_CONNECTIONS:-20}
      TMDB_MAX_ATTEMPTS: ${TMDB_MAX_ATTEMPTS:-4}
      TMDB_REQUEST_TIMEOUT_SECONDS: ${TMDB_REQUEST_TIMEOUT_SECONDS:-30}
      TMDB_DAILY_EXPORT_MAX_BYTES: ${TMDB_DAILY_EXPORT_MAX_BYTES:-536870912}
      TMDB_WORKER_ID: ${TMDB_INGEST_WORKER_ID:-tmdb-stress-worker}
      TMDB_WORKER_LEASE_SECONDS: 60
      TMDB_WORKER_HEARTBEAT_SECONDS: 15
      TMDB_WORKER_IDLE_POLL_MS: 100
      TMDB_ENABLE_SCHEDULER: ${TMDB_ENABLE_SCHEDULER:-true}
      TMDB_SCHEDULER_INTERVAL_SECONDS: ${TMDB_SCHEDULER_INTERVAL_SECONDS:-60}
      TMDB_ENABLE_DAILY_EXPORT: ${TMDB_ENABLE_DAILY_EXPORT:-false}
      ALLOW_LOCAL_MEDIA: ${ALLOW_LOCAL_MEDIA:-true}
    secrets:
      - migrator_password
      - ingest_writer_password
      - tmdb_read_access_token
    volumes:
      - tmdb_stress_config:/config
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    init: true
    networks: [tmdb-private]

  media:
    image: ${TMDB_STRESS_APP_IMAGE:-tmdb-stress-app:local}
    restart: on-failure
    entrypoint: [/usr/local/bin/tmdb-images]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TMDB_ENVIRONMENT: test
      TMDB_DIRECT_DB_HOST: postgres
      TMDB_DIRECT_DB_PORT: 5432
      TMDB_DIRECT_DB_NAME: tmdb
      TMDB_DIRECT_DB_USER: image_writer
      TMDB_DIRECT_DB_PASSWORD_FILE: /run/secrets/image_writer_password
      TMDB_WORKER_ID: ${TMDB_IMAGE_WORKER_ID:-tmdb-stress-media}
      TMDB_WORKER_LEASE_SECONDS: 60
      TMDB_WORKER_HEARTBEAT_SECONDS: 15
      TMDB_WORKER_IDLE_POLL_MS: 100
      TMDB_TRAWL_BASE_URL: ${TMDB_TRAWL_BASE_URL:-http://trawl.example.invalid:8191}
      ALLOW_LOCAL_MEDIA: ${ALLOW_LOCAL_MEDIA:-true}
      TMDB_MEDIA_BIND: 0.0.0.0:8090
    secrets: [image_writer_password]
    volumes:
      - type: volume
        source: tmdb_stress_media
        target: /media
        volume:
          nocopy: true
      - tmdb_stress_config:/config
    ports:
      - 127.0.0.1:${TMDB_STRESS_IMAGE_PORT:-18090}:8090
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    init: true
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8090/health/live]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks: [tmdb-private]

secrets:
  postgres_owner_password:
    file: "${TMDB_STRESS_SECRET_ROOT:?TMDB_STRESS_SECRET_ROOT must be set}/postgres_owner_password"
  migrator_password:
    file: "${TMDB_STRESS_SECRET_ROOT:?TMDB_STRESS_SECRET_ROOT must be set}/migrator_password"
  api_reader_password:
    file: "${TMDB_STRESS_SECRET_ROOT:?TMDB_STRESS_SECRET_ROOT must be set}/api_reader_password"
  api_job_submitter_password:
    file: "${TMDB_STRESS_SECRET_ROOT:?TMDB_STRESS_SECRET_ROOT must be set}/api_job_submitter_password"
  ingest_writer_password:
    file: "${TMDB_STRESS_SECRET_ROOT:?TMDB_STRESS_SECRET_ROOT must be set}/ingest_writer_password"
  image_writer_password:
    file: "${TMDB_STRESS_SECRET_ROOT:?TMDB_STRESS_SECRET_ROOT must be set}/image_writer_password"
  monitor_password:
    file: "${TMDB_STRESS_SECRET_ROOT:?TMDB_STRESS_SECRET_ROOT must be set}/monitor_password"
  tmdb_read_access_token:
    file: "${TMDB_STRESS_SECRET_ROOT:?TMDB_STRESS_SECRET_ROOT must be set}/tmdb_read_access_token"
  tmdb_api_key:
    file: "${TMDB_STRESS_SECRET_ROOT:?TMDB_STRESS_SECRET_ROOT must be set}/tmdb_api_key"

volumes:
  tmdb_stress_pg18_data:
    name: ${TMDB_STRESS_PROJECT:-tmdb_stress_test}_pg18_data
  tmdb_stress_config:
    name: ${TMDB_STRESS_PROJECT:-tmdb_stress_test}_config
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=10001,gid=10001,mode=0770
  tmdb_stress_media:
    name: ${TMDB_STRESS_PROJECT:-tmdb_stress_test}_media

networks:
  tmdb-private:
    name: ${TMDB_STRESS_PROJECT:-tmdb_stress_test}_private
    driver: bridge
