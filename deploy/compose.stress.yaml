# Disposable four-container stress environment. Runtime settings are written
# once to the ignored compose.env file by stress-bootstrap.ps1.
services:
  postgres:
    image: postgres:18-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
    restart: unless-stopped
    env_file: ["${TMDB_STRESS_ENV_FILE:?TMDB_STRESS_ENV_FILE must be set}"]
    shm_size: 1gb
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
      - -c
      - timezone=UTC
      - -c
      - max_connections=${TMDB_STRESS_PG_MAX_CONNECTIONS:-120}
      - -c
      - shared_buffers=${TMDB_STRESS_PG_SHARED_BUFFERS:-2GB}
      - -c
      - effective_cache_size=${TMDB_STRESS_PG_EFFECTIVE_CACHE_SIZE:-8GB}
      - -c
      - work_mem=${TMDB_STRESS_PG_WORK_MEM:-32MB}
      - -c
      - maintenance_work_mem=${TMDB_STRESS_PG_MAINTENANCE_WORK_MEM:-512MB}
      - -c
      - wal_compression=on
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=64
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_completion_target=0.9
    ports:
      - 127.0.0.1:${TMDB_STRESS_PG_PORT:-55433}:5432
    volumes:
      - tmdb_stress_pg18_data:/var/lib/postgresql
      - ../infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -h 127.0.0.1 -t 1']
      interval: 2s
      timeout: 3s
      retries: 45
      start_period: 10s
    networks: [tmdb-private]

  api:
    image: ${TMDB_STRESS_APP_IMAGE:-tmdb-stress-app:local}
    restart: on-failure
    env_file: ["${TMDB_STRESS_ENV_FILE:?TMDB_STRESS_ENV_FILE must be set}"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 127.0.0.1:${TMDB_STRESS_API_PORT:-18080}:8080
      - 127.0.0.1:${TMDB_STRESS_ADMIN_PORT:-18081}:8081
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    init: true
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, http://127.0.0.1:8080/health/live]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks: [tmdb-private]

  worker:
    image: ${TMDB_STRESS_APP_IMAGE:-tmdb-stress-app:local}
    restart: on-failure
    env_file: ["${TMDB_STRESS_ENV_FILE:?TMDB_STRESS_ENV_FILE must be set}"]
    entrypoint: [/usr/local/bin/tmdb-runtime, worker]
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - tmdb_stress_config:/config
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, SETPCAP]
    init: true
    networks: [tmdb-private]

  media:
    image: ${TMDB_STRESS_APP_IMAGE:-tmdb-stress-app:local}
    restart: on-failure
    env_file: ["${TMDB_STRESS_ENV_FILE:?TMDB_STRESS_ENV_FILE must be set}"]
    entrypoint: [/usr/local/bin/tmdb-runtime, media]
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - type: volume
        source: tmdb_stress_media
        target: /media
        volume:
          nocopy: true
      - tmdb_stress_config:/config
    ports:
      - 127.0.0.1:${TMDB_STRESS_IMAGE_PORT:-18090}:8090
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, SETPCAP]
    init: true
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8090/health/live]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks: [tmdb-private]

volumes:
  tmdb_stress_pg18_data:
    name: ${TMDB_STRESS_PROJECT:-tmdb_stress_test}_pg18_data
  tmdb_stress_config:
    name: ${TMDB_STRESS_PROJECT:-tmdb_stress_test}_config
  tmdb_stress_media:
    name: ${TMDB_STRESS_PROJECT:-tmdb_stress_test}_media

networks:
  tmdb-private:
    name: ${TMDB_STRESS_PROJECT:-tmdb_stress_test}_private
    driver: bridge
