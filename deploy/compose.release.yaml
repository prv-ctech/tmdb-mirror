# This template is rendered into a deployable, digest-pinned Compose artifact
# for every vX.Y.Z GitHub release. The two image markers must be replaced only
# with immutable `ghcr.io/...@sha256:...` references.

name: tmdb-mirror

x-app-common: &app-common
  image: __TMDB_MIRROR_APP_IMAGE__
  restart: unless-stopped
  env_file:
    - ${TMDB_ENV_FILE:-./.env}
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  init: true

services:
  postgres:
    image: __TMDB_MIRROR_POSTGRES_IMAGE__
    user: "0:0"
    restart: unless-stopped
    env_file:
      - ${TMDB_ENV_FILE:-./.env}
    shm_size: 2gb
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
      - -c
      - timezone=UTC
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=tmdb archive-push %p
      - -c
      - archive_timeout=300s
      - -c
      - max_connections=200
      - -c
      - shared_buffers=32GB
      - -c
      - effective_cache_size=96GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - wal_compression=on
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=256
    volumes:
      - tmdb-postgres:/var/lib/postgresql
      - tmdb-config:/config
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -h 127.0.0.1 -t 1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - "your.network"

  api:
    <<: *app-common
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, http://127.0.0.1:9000/health/live]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      "your.network":
        aliases:
          - tmdb-mirror-api

  worker:
    <<: *app-common
    init: false
    entrypoint: [/usr/local/bin/tmdb-runtime, worker]
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - tmdb-config:/config
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - SETPCAP
    networks:
      - "your.network"

  media:
    <<: *app-common
    init: false
    entrypoint: [/usr/local/bin/tmdb-runtime, media]
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - tmdb-media:/media
      - tmdb-config:/config
    ports:
      - "9002:9002"
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - SETPCAP
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:9002/health/live]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - "your.network"

volumes:
  tmdb-postgres:
  tmdb-config:
  tmdb-media:

networks:
  "your.network":
    external: true
